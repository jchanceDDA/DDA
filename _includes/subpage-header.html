<header class="fabrx-header dda-header bg-white border-bottom border-gray-200 sticky-top">
    <div class="container">
        <nav class="navbar navbar-expand-lg py-3" aria-label="Main navigation">
            <a class="navbar-brand me-4" href="{{ '/' | relative_url }}"
                aria-label="Griffin Downtown Development Authority home">
                <img src="{{ '/assets/img/dda_logo_subpage.png' | relative_url }}"
                    alt="Griffin Downtown Development Authority">
            </a>
            <button class="navbar-toggler border-0 shadow-none px-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#dda-navbar" aria-controls="dda-navbar" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="dda-navbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link{% if page.nav_active == 'home' %} active{% endif %}"
                            href="{{ '/' | relative_url }}">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if page.nav_active == 'galleries' %} active{% endif %}"
                            href="{{ '/site_photos' | relative_url }}">Site Photos</a>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</header>
